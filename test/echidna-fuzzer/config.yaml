# Config wiki: https://secure-contracts.com/program-analysis/echidna/configuration.html

# testMode: mode to use while testing
# Available modes:
# - property: check properties, in this mode, the test function's name must start with 'echidna'
# - assertion: check assertions
# - exploration: explore the contract
# - optimization: optimize a property
testMode: "assertion"

# allContracts: if true, all contracts in the codebase will be considered main contracts for testing
# Default: false
# guide: https://secure-contracts.com/program-analysis/echidna/advanced/using-all-contracts.html
allContracts: false

# SharedVault uses external libraries. Echidna needs the libraries deployed and
# crytic-compile needs the same addresses linked into SharedVault bytecode.
deployContracts:
  [
    ["0x1000000000000000000000000000000000000001", "SharedVaultPreviewLib"],
    ["0x1000000000000000000000000000000000000007", "SharedSwapDataSignature"],
  ]
# crytic-compile args. Echidna forwards these to BOTH its own compile and to its
# `slither --ignore-compile ... <cryticArgs>` source-analysis pass
# (see Echidna.SourceAnalysis.Slither.runSlither).
#  - compile-libraries: link the external libs at the same addresses Echidna deploys them.
#  - foundry-out-directory: on the --ignore-compile path, crytic-compile 0.4.1 does NOT read
#    foundry's `out` setting and defaults to `out/build-info`. This project builds to
#    `artifacts/` (foundry.toml `out = 'artifacts'`), so without this flag slither dies with
#    "out/build-info is not a directory", echidna reports "Running slither failed ... fuzzing
#    will likely be less effective", and you silently lose constant mining + guided exploration.
cryticArgs:
  [
    "--compile-libraries=(SharedVaultPreviewLib,0x1000000000000000000000000000000000000001),(SharedSwapDataSignature,0x1000000000000000000000000000000000000007)",
    "--foundry-out-directory=artifacts",
  ]

# balanceContract: balance of deployed contract in wei
balanceContract: 1000000000000000000000000
# Default: 0

# Directory to save corpus
# Default: null
# corpusDir: ".corpus"

# Number of test sequences to run
# Default: 50000
testLimit: 999999999999999999 # unlimited

deployer: "0x10000"
