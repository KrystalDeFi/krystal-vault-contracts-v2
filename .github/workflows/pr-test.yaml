name: Run tests on the PR and write the documentation

on:
  pull_request:
    branches: [main]

env:
  # osaka-only contracts: need --evm-version osaka (EIP-7702 + P256).
  OSAKA_CONTRACTS: "PrivateVaultAutomatorSmartWalletOwner|PrivateVaultAutomatorPasskeyOwner|PrivateVaultSmartWalletOwnerFork|PrivateVaultBizFork|PrivateVaultAutomator7702RawSig|PrivateVaultAutomator7702Integration"
  # Disabled integration tests — excluded from the gate EXPLICITLY (not by an in-test
  # skip), so nothing is silently green:
  #   Katana   -> forks Ronin; no public archive node exists to record.
  #   HyperEVM -> fork mechanism unreliable (per team decision).
  # (BizFork is hermetic — pinned to a cached Ethereum block — and runs in the osaka step.)
  # NOTE: --no-match-path is a GLOB (not a regex). Brace expansion excludes exactly
  # Integration.Katana.t.sol + the 3 Integration.HyperEVM*.t.sol files.
  NON_HERMETIC_PATH: "test/integration/Integration.{Katana,HyperEVM}*.t.sol"
  # Canonical URLs Foundry resolves to a chain-id WITHOUT a live probe, so --offline
  # replays the pinned blocks from the restored cache. Do NOT swap these for
  # non-canonical endpoints (base.merkle.io, base.llamarpc.com, eth.merkle.io, ...) —
  # those force a live probe and re-introduce the node dependency this design removes.
  FORK_BASE_RPC: "https://mainnet.base.org"
  FORK_ETH_RPC: "https://mainnet.gateway.tenderly.co"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # BLOCKING GATE — hermetic AND fail-loud.
  # The full suite (unit + fork/integration) runs offline, with fork state
  # replayed from committed fixtures (test/fixtures/rpc-cache). No RPC node is ever
  # contacted. There are NO in-test skips here: every selected test passes or fails
  # loudly. A missing/stale cache or a misconfigured URL -> hard failure (red), never
  # a silent green. Tests that cannot be hermetic are excluded explicitly (see env).
  # ───────────────────────────────────────────────────────────────────────────
  pr-test:
    if: github.actor != 'Krystal-CICD'
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v2
        with:
          token: ${{ secrets.CICD_BOT_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - run: |
          npm install -g yarn
          yarn install

      # Compile ONLINE first: foundry-toolchain ships forge but not solc, and the
      # steps below run --offline (which cannot fetch a missing solc). This installs
      # solc 0.8.28 via svm and warms the build cache for both EVM targets.
      - name: Compile (online — installs solc)
        run: |
          forge build --via-ir
          forge build --via-ir --evm-version osaka

      # Replay recorded on-chain state — makes the fork tests fully offline.
      - name: Restore RPC cache fixtures
        run: |
          mkdir -p ~/.foundry/cache/rpc
          cp -R test/fixtures/rpc-cache/base ~/.foundry/cache/rpc/
          cp -R test/fixtures/rpc-cache/mainnet ~/.foundry/cache/rpc/
          cp -R test/fixtures/rpc-cache/berachain ~/.foundry/cache/rpc/
          echo "Restored: $(find ~/.foundry/cache/rpc -type f | wc -l) cache files"

      # Full suite, cancun EVM, offline. Forks served from cache. Non-hermetic
      # families excluded by path; osaka-only contracts run in the next step.
      - name: Test suite (cancun, offline)
        env:
          RPC_URL: ${{ env.FORK_BASE_RPC }}
          ECHIDNA_RPC_URL: ${{ env.FORK_ETH_RPC }}
          FOUNDRY_OFFLINE: "true"
        run: |
          forge test --offline -vvv --via-ir \
            --no-match-path "$NON_HERMETIC_PATH" \
            --no-match-contract "$OSAKA_CONTRACTS"

      # osaka-only contracts (EIP-7702 + P256), offline. Base forks AND BizFork
      # (pinned to a cached Ethereum block) all replay from the restored cache.
      - name: Test suite (osaka, offline)
        env:
          RPC_URL: ${{ env.FORK_BASE_RPC }}
          MAINNET_RPC_URL: ${{ env.FORK_ETH_RPC }}
          FOUNDRY_OFFLINE: "true"
        run: |
          forge test --offline -vvv --via-ir --evm-version osaka \
            --match-contract "$OSAKA_CONTRACTS"

      - name: Generate + commit documentation
        env:
          GH_TOKEN: ${{ secrets.CICD_BOT_TOKEN }}
        run: |
          set -e
          yarn docgen

          git config user.name "Krystal-CICD"
          git config user.email "Krystal-CICD@users.noreply.github.com"

          CURRENT_BRANCH=$(echo ${GITHUB_HEAD_REF})
          git checkout $CURRENT_BRANCH
          git pull origin $CURRENT_BRANCH

          if [[ -n "$(git status --porcelain)" ]]; then
            git add .
            git commit -m "Add documentation for PR"
            git push origin $CURRENT_BRANCH
            echo "Pushed the documentation to the branch"
          else
            echo "No changes to commit"
          fi
